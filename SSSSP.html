<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SSSS+ — Encodeur / Décodeur Unicode à clé</title>

  <link rel="stylesheet" href="./assets/css/header.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <script src="./assets/js/header.js" defer></script>
  <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon">

  <style>
    body {
      margin: 0;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 20px;
      margin-top: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.18);
      color: inherit;
      font: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(255, 255, 255, 0.4);
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      font-family: monospace;
    }

    .field {
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font: inherit;
    }

    .status {
      margin-top: 14px;
      min-height: 22px;
      opacity: 0.9;
    }

    .hint {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-top: 7px;
    }
  </style>
</head>

<body>

  <header>
    <h1>SSSS+ — Encodeur / Décodeur Unicode à clé</h1>
  </header>

  <main class="wrap">

    <!-- Clé -->
    <section class="card">
      <div class="field">
        <label for="key">Clé</label>

        <input
          id="key"
          type="text"
          autocomplete="off"
          placeholder="Entrez la clé"
        >

        <div class="hint">
          La clé sert directement à déterminer les décalages Unicode.
          Elle n'est jamais enregistrée dans le texte encodé.
        </div>
      </div>
    </section>

    <!-- Texte clair -->
    <section class="card">
      <div class="field">
        <label for="plain">Texte à encoder</label>

        <textarea
          id="plain"
          placeholder="Entrez le texte à encoder..."
        ></textarea>
      </div>
    </section>

    <!-- Texte encodé -->
    <section class="card">
      <div class="field">
        <label for="encoded">Texte encodé</label>

        <textarea
          id="encoded"
          placeholder="Le texte encodé apparaîtra ici..."
        ></textarea>
      </div>
    </section>

    <!-- Boutons -->
    <section class="card">

      <div class="buttons">
        <button id="encodeBtn" type="button">
          Encoder
        </button>

        <button id="decodeBtn" type="button">
          Décoder
        </button>

        <button id="clearBtn" type="button">
          Effacer
        </button>

        <button id="copyBtn" type="button">
          Copier
        </button>

        <button id="exampleBtn" type="button">
          Exemple
        </button>

        <button id="downloadBtn" type="button">
          Télécharger
        </button>
      </div>

      <div id="status" class="status"></div>

    </section>

  </main>

<script>
"use strict";

/*
 * ============================================================
 * SSSS+
 * Encodeur / Décodeur Unicode à clé
 * ============================================================
 *
 * Principe :
 *
 *   clé
 *    ↓
 * générateur pseudo-aléatoire déterministe
 *    ↓
 * suite de décalages Unicode
 *    ↓
 * texte transformé
 *    ↓
 * UTF-8
 *    ↓
 * Base64
 *
 * IMPORTANT :
 * - la clé n'est JAMAIS stockée dans le résultat ;
 * - les décalages ne sont JAMAIS stockés dans le résultat ;
 * - le décodage reconstruit les mêmes décalages à partir de la clé ;
 * - aucune signature n'est ajoutée ;
 * - une mauvaise clé peut donc produire du texte valide :
 *   ce n'est volontairement pas considéré comme une erreur.
 */


/* ============================================================
 * DOM
 * ============================================================ */

const keyInput = document.getElementById("key");
const plainInput = document.getElementById("plain");
const encodedInput = document.getElementById("encoded");

const encodeBtn = document.getElementById("encodeBtn");
const decodeBtn = document.getElementById("decodeBtn");
const clearBtn = document.getElementById("clearBtn");
const copyBtn = document.getElementById("copyBtn");
const exampleBtn = document.getElementById("exampleBtn");
const downloadBtn = document.getElementById("downloadBtn");

const status = document.getElementById("status");


/* ============================================================
 * Constantes Unicode
 * ============================================================
 *
 * Unicode possède 0x110000 valeurs possibles.
 *
 * Les 0x800 valeurs comprises entre D800 et DFFF sont réservées
 * aux surrogate pairs UTF-16 et ne sont pas des Unicode scalar
 * values valides.
 *
 * On travaille donc sur :
 *
 *   0x110000 - 0x800 = 0x10F800
 *
 * valeurs Unicode valides.
 *
 * Cette représentation garantit que le décalage est parfaitement
 * réversible.
 */

const UNICODE_SCALARS = 0x10F800;
const SURROGATE_START = 0xD800;
const SURROGATE_COUNT = 0x800;


/* ============================================================
 * Conversion Unicode <-> index compact
 * ============================================================ */

function scalarToIndex(codePoint) {
  if (codePoint < SURROGATE_START) {
    return codePoint;
  }

  return codePoint - SURROGATE_COUNT;
}


function indexToScalar(index) {
  if (index < SURROGATE_START) {
    return index;
  }

  return index + SURROGATE_COUNT;
}


/* ============================================================
 * Décalage Unicode
 * ============================================================ */

function shiftScalar(codePoint, shift) {

  const index = scalarToIndex(codePoint);

  const shiftedIndex =
    (index + shift) % UNICODE_SCALARS;

  return indexToScalar(shiftedIndex);
}


function unshiftScalar(codePoint, shift) {

  const index = scalarToIndex(codePoint);

  const shiftedIndex =
    (index - shift + UNICODE_SCALARS) % UNICODE_SCALARS;

  return indexToScalar(shiftedIndex);
}


/* ============================================================
 * Hash de la clé
 * ============================================================
 *
 * FNV-1a 32 bits.
 *
 * Ce n'est pas présenté comme du chiffrement cryptographique.
 * Il sert ici à transformer la clé en état initial déterministe.
 */

function hashKey(bytes, initial) {

  let hash = initial >>> 0;

  for (let i = 0; i < bytes.length; i++) {

    hash ^= bytes[i];

    hash =
      Math.imul(hash, 0x01000193) >>> 0;
  }

  return hash >>> 0;
}


/* ============================================================
 * Mélange 32 bits
 * ============================================================ */

function mix32(value) {

  value >>>= 0;

  value ^= value >>> 16;
  value = Math.imul(value, 0x85EBCA6B) >>> 0;

  value ^= value >>> 13;
  value = Math.imul(value, 0xC2B2AE35) >>> 0;

  value ^= value >>> 16;

  return value >>> 0;
}


/* ============================================================
 * Générateur déterministe basé UNIQUEMENT sur la clé
 * ============================================================ */

function createGenerator(key) {

  const bytes =
    new TextEncoder().encode(key);

  if (bytes.length === 0) {
    throw new Error("La clé est vide.");
  }

  let stateA =
    hashKey(bytes, 0x811C9DC5);

  let stateB =
    hashKey(bytes, 0x12345678);

  stateA =
    mix32(stateA ^ bytes.length);

  stateB =
    mix32(stateB ^ (bytes.length * 0x9E3779B9));

  /*
   * Retourne un nombre pseudo-aléatoire 32 bits.
   *
   * La suite obtenue est entièrement déterminée
   * par la clé.
   */

  return function nextRandom() {

    stateA =
      (stateA + 0x6D2B79F5) >>> 0;

    let t = stateA;

    t =
      Math.imul(
        t ^ (t >>> 15),
        t | 1
      ) >>> 0;

    t ^=
      t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    t >>>= 0;

    stateB =
      (stateB + 0x9E3779B9) >>> 0;

    let u = stateB;

    u =
      Math.imul(
        u ^ (u >>> 16),
        0x21F0AAAD
      ) >>> 0;

    u =
      Math.imul(
        u ^ (u >>> 15),
        0x735A2D97
      ) >>> 0;

    u ^=
      u >>> 15;

    u >>>= 0;

    /*
     * Mélange des deux états.
     */

    return (t ^ u) >>> 0;
  };
}


/* ============================================================
 * Génération d'un décalage Unicode
 * ============================================================ */

function nextShift(generator) {

  return generator() % UNICODE_SCALARS;
}


/* ============================================================
 * Transformation du texte
 * ============================================================ */

function transformText(text, key, reverse) {

  const generator =
    createGenerator(key);

  let result = "";

  /*
   * for...of parcourt les code points Unicode,
   * et pas simplement les unités UTF-16.
   *
   * Cela permet notamment de gérer correctement :
   * - les accents ;
   * - les emojis ;
   * - les caractères asiatiques ;
   * - les caractères hors BMP.
   */

  for (const character of text) {

    const codePoint =
      character.codePointAt(0);

    const shift =
      nextShift(generator);

    const transformedCodePoint =
      reverse
        ? unshiftScalar(codePoint, shift)
        : shiftScalar(codePoint, shift);

    result +=
      String.fromCodePoint(transformedCodePoint);
  }

  return result;
}


/* ============================================================
 * Base64 UTF-8
 * ============================================================ */

function utf8ToBase64(text) {

  const bytes =
    new TextEncoder().encode(text);

  let binary = "";

  /*
   * Conversion par morceaux pour éviter de dépasser
   * la limite d'arguments de String.fromCharCode.
   */

  const CHUNK_SIZE = 0x8000;

  for (
    let i = 0;
    i < bytes.length;
    i += CHUNK_SIZE
  ) {

    const chunk =
      bytes.subarray(
        i,
        Math.min(i + CHUNK_SIZE, bytes.length)
      );

    binary +=
      String.fromCharCode(...chunk);
  }

  return btoa(binary);
}


function base64ToUtf8(base64) {

  /*
   * atob() vérifie la structure Base64.
   */

  const binary =
    atob(base64);

  const bytes =
    new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] =
      binary.charCodeAt(i);
  }

  /*
   * fatal:true permet de détecter une séquence UTF-8 invalide
   * au lieu de la remplacer silencieusement.
   */

  const decoder =
    new TextDecoder("utf-8", {
      fatal: true
    });

  return decoder.decode(bytes);
}


/* ============================================================
 * Encodage
 * ============================================================ */

function encodeText(text, key) {

  if (!key) {
    throw new Error("Veuillez entrer une clé.");
  }

  /*
   * La clé n'est PAS ajoutée au texte.
   *
   * Les décalages sont générés directement à partir de la clé.
   */

  const transformed =
    transformText(
      text,
      key,
      false
    );

  /*
   * Seul le texte transformé est stocké.
   */

  return utf8ToBase64(transformed);
}


/* ============================================================
 * Décodage
 * ============================================================ */

function decodeText(encoded, key) {

  if (!key) {
    throw new Error("Veuillez entrer une clé.");
  }

  /*
   * On commence par décoder le Base64.
   */

  const transformed =
    base64ToUtf8(encoded);

  /*
   * Puis on régénère exactement la même suite de décalages
   * grâce à la clé fournie.
   *
   * Si la clé est mauvaise, elle produira simplement une autre
   * suite de décalages.
   */

  return transformText(
    transformed,
    key,
    true
  );
}


/* ============================================================
 * Statut
 * ============================================================ */

function setStatus(message, error = false) {

  status.textContent = message;

  /*
   * On évite d'imposer une couleur particulière au thème.
   * L'opacité est suffisante pour distinguer le message.
   */

  status.style.fontWeight =
    error ? "600" : "normal";
}


/* ============================================================
 * Encoder
 * ============================================================ */

encodeBtn.addEventListener("click", () => {

  try {

    const text =
      plainInput.value;

    const key =
      keyInput.value;

    const result =
      encodeText(
        text,
        key
      );

    encodedInput.value =
      result;

    setStatus(
      "Texte encodé avec succès."
    );

  } catch (error) {

    setStatus(
      "Erreur d'encodage : " +
      error.message,
      true
    );
  }
});


/* ============================================================
 * Décoder
 * ============================================================ */

decodeBtn.addEventListener("click", () => {

  try {

    const encoded =
      encodedInput.value.trim();

    const key =
      keyInput.value;

    if (!encoded) {
      throw new Error(
        "Aucun texte encodé à décoder."
      );
    }

    const result =
      decodeText(
        encoded,
        key
      );

    plainInput.value =
      result;

    setStatus(
      "Texte décodé avec succès."
    );

  } catch (error) {

    /*
     * Mauvais Base64 ou UTF-8 invalide :
     * erreur de décodage.
     *
     * Une mauvaise clé qui donne malgré tout
     * un Unicode valide n'est PAS une erreur.
     */

    setStatus(
      "Erreur de décodage : " +
      error.message,
      true
    );
  }
});


/* ============================================================
 * Effacer
 * ============================================================ */

clearBtn.addEventListener("click", () => {

  plainInput.value = "";
  encodedInput.value = "";
  keyInput.value = "";

  setStatus("");
});


/* ============================================================
 * Copier
 * ============================================================ */

copyBtn.addEventListener("click", async () => {

  try {

    const text =
      encodedInput.value;

    if (!text) {
      throw new Error(
        "Rien à copier."
      );
    }

    await navigator.clipboard.writeText(text);

    setStatus(
      "Texte encodé copié."
    );

  } catch (error) {

    setStatus(
      "Impossible de copier le texte.",
      true
    );
  }
});


/* ============================================================
 * Exemple
 * ============================================================ */

exampleBtn.addEventListener("click", () => {

  keyInput.value =
    "ma-cle-secrete";

  plainInput.value =
    "Bonjour 👋 Ceci est un texte Unicode : éàù — 日本語 — Ελληνικά — العربية — 🚀";

  encodedInput.value = "";

  setStatus(
    "Exemple chargé."
  );
});


/* ============================================================
 * Télécharger
 * ============================================================ */

downloadBtn.addEventListener("click", () => {

  try {

    const content =
      encodedInput.value;

    if (!content) {
      throw new Error(
        "Aucun texte encodé à télécharger."
      );
    }

    const blob =
      new Blob(
        [content],
        {
          type: "text/plain;charset=utf-8"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;
    link.download =
      "sssss-plus.txt";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    setStatus(
      "Fichier téléchargé."
    );

  } catch (error) {

    setStatus(
      error.message,
      true
    );
  }
});
</script>

</body>
</html>
